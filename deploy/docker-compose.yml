# SPDX-License-Identifier: AGPL-3.0-or-later
#
# PerFin reference deployment (SECURITY.md H1-H3, ARCHITECTURE.md "Deployment
# topology").
#
#   cp .env.example .env && chmod 600 .env   # replace every CHANGE_ME
#   cp Caddyfile.example Caddyfile           # set your host name
#   mkdir -p inbox processed && sudo chown 10001:10001 processed
#   docker compose up -d                     # proxy, api, worker, db (+ migrate)
#   docker compose --profile egress up -d    # optional outbound allowlist proxy
#   docker compose --profile av up -d        # optional ClamAV
#   docker compose --profile mcp up -d       # optional read-only MCP server
#
# Hardening (checked by backend/tests/unit/test_compose_hardening.py):
#   H1  app containers run as UID 10001 with a read-only root filesystem,
#       every capability dropped, no-new-privileges, Docker's default seccomp
#       profile, tmpfs scratch, and pid/memory limits. Third-party containers
#       get the same treatment as far as each image allows.
#   H2  only `proxy` publishes ports. api, worker, mcp, migrate and db are
#       attached to `internal: true` networks only (no route out); the worker
#       is not on any network the proxy can reach. Outbound traffic, when an
#       integration needs it, goes through the `egress` allowlist proxy.
#   H3  db publishes nothing, uses SCRAM-SHA-256, and creates a non-superuser
#       app role and a separate owner role (deploy/db-init). The app connects
#       as perfin_app; only the one-shot `migrate` service holds the owner
#       password, and api/worker start only after it succeeded.
#
# Networks:
#   edge      proxy only; the published ports live here. Fixed subnet so
#             its gateway (the address host-local clients such as an SSH
#             tunnel arrive from) is predictable for PERFIN_BREAKGLASS_CIDRS
#   web       proxy <-> api; fixed subnet so the API trusts
#             X-Forwarded-* from the proxy's address only
#   ai        mcp <-> api only: the MCP container reaches nothing else
#             (no db, worker or egress; AI_ACCESS.md M7)
#   mcp_edge  proxy -> mcp, for the optional streamable-HTTP transport
#   backend   api, worker, migrate, db (and clamav)
#   egress    api, worker (and clamav) <-> egress proxy
#   outbound  egress proxy only; the single path to the internet

name: perfin

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Hardening shared by every PerFin container (H1).
x-hardened: &hardened
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  init: true
  pids_limit: 256
  mem_limit: 1g
  memswap_limit: 1g
  tmpfs:
    - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
  logging: *logging

x-perfin-image: &perfin-image
  image: ${APP_IMAGE:-ghcr.io/bchap9/perfin}:${PERFIN_VERSION:-latest}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    # Base-image overrides (e.g. a registry mirror); unset uses the
    # Dockerfile defaults.
    args:
      - NODE_IMAGE
      - PYTHON_IMAGE
      - UV_IMAGE

services:
  # ---------------------------------------------------------------- proxy --
  # TLS termination, HSTS, body limits (Caddyfile). The only service with
  # published ports. Runs as UID 10002 (not the app's UID) with only
  # NET_BIND_SERVICE, which the caddy binary needs to start at all.
  proxy:
    image: ${CADDY_IMAGE:-docker.io/library/caddy:2}
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    memswap_limit: 256m
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: {}
      web:
        ipv4_address: ${PROXY_WEB_IP:-172.30.80.10}
      # Only for the optional MCP HTTP transport (Caddyfile.example).
      mcp_edge: {}
    depends_on:
      proxy-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # One-shot: hand Caddy's state volumes to UID 10002. CHOWN is the only
  # capability and there is no network. A volume Caddy already owns is left
  # alone: Caddy creates its subdirectories with mode 0700, which root
  # without CAP_DAC_READ_SEARCH cannot traverse, so a repeated `chown -R`
  # failed and every later `docker compose up` (an upgrade, a start after
  # `down`) left the proxy stopped (found by the v1.0.0 verification run,
  # docs/RELEASE_CHECKLIST.md).
  proxy-init:
    image: ${CADDY_IMAGE:-docker.io/library/caddy:2}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        for d in /data /config; do
        [ "$$(stat -c %u:%g "$$d")" = 10002:10002 ] || chown -R 10002:10002 "$$d" || exit 1;
        done
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 16
    mem_limit: 64m
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: "no"
    logging: *logging

  # -------------------------------------------------------------- migrate --
  # One-shot `perfin migrate` as the owner role. api and worker wait for it.
  migrate:
    <<: [*hardened, *perfin-image]
    command: ["migrate"]
    env_file: [.env]
    environment:
      # Owner credentials only; nothing else secret.
      PERFIN_DATABASE_URL: ""
      PERFIN_MASTER_KEY: ""
      PERFIN_SECRET_KEY: ""
      PERFIN_OIDC_CLIENT_SECRET: ""
      PERFIN_SMTP_PASSWORD: ""
      PERFIN_PRICE_PROVIDER_API_KEY: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_OWNER_PASSWORD: ""
      POSTGRES_APP_PASSWORD: ""
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      disable: true
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------------ api --
  api:
    <<: [*hardened, *perfin-image]
    command: ["api"]
    env_file: [.env]
    environment:
      PERFIN_ROLE: api
      PERFIN_MIGRATION_DATABASE_URL: ""
      # Only the worker's refresh_prices job calls the price feed.
      PERFIN_PRICE_PROVIDER_API_KEY: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_OWNER_PASSWORD: ""
      POSTGRES_APP_PASSWORD: ""
    volumes:
      - documents:/var/lib/perfin/documents
      - quarantine:/var/lib/perfin/quarantine
    # `egress` only matters with the egress profile: OIDC discovery, JWKS and
    # token exchange with an IdP listed in egress-allowlist.txt.
    networks: [web, backend, egress, ai]
    # Image HEALTHCHECK: `perfin healthcheck` probes 127.0.0.1:8000/healthz.
    stop_grace_period: 40s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # --------------------------------------------------------------- worker --
  # Parses untrusted files (ADR-0006): no published ports, not reachable
  # from the proxy, no route out except the optional egress proxy.
  # The extraction child shares UID 10001; it is isolated by a non-dumpable
  # worker, Landlock and seccomp filesystem rules (ADR-0009), which need a
  # host kernel with Landlock and Docker's default seccomp profile.
  worker:
    <<: [*hardened, *perfin-image]
    command: ["worker"]
    env_file: [.env]
    environment:
      PERFIN_ROLE: worker
      PERFIN_MIGRATION_DATABASE_URL: ""
      # Only the api sends mail (password reset).
      PERFIN_SMTP_PASSWORD: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_OWNER_PASSWORD: ""
      POSTGRES_APP_PASSWORD: ""
      PERFIN_DROPFOLDER_INBOX: /var/lib/perfin/inbox
      PERFIN_DROPFOLDER_PROCESSED: /var/lib/perfin/processed
    pids_limit: 512
    mem_limit: 2g
    memswap_limit: 2g
    tmpfs:
      # OCR and rendering scratch for the extraction sandbox.
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
    volumes:
      - documents:/var/lib/perfin/documents
      - quarantine:/var/lib/perfin/quarantine
      # Drop folder (INGESTION.md): the inbox is read-only; processed files
      # go to a writable sibling, never back into the inbox.
      - ${DROPFOLDER_HOST_INBOX:-./inbox}:/var/lib/perfin/inbox:ro
      - ${DROPFOLDER_HOST_PROCESSED:-./processed}:/var/lib/perfin/processed
    networks: [backend, egress]
    healthcheck:
      # The worker serves no HTTP; its internal metrics endpoint answering
      # means the process is alive. The probe runs under `env -i`: it is a
      # dumpable process of the worker's UID, so it must not carry the
      # master key, secret key or database URL from env_file where an
      # extraction child without Landlock could read /proc/<pid>/environ
      # (review finding P2-SR-R2-02, ADR-0009).
      test:
        - CMD-SHELL
        - >-
          exec env -i /app/.venv/bin/python -I -c "import sys, urllib.request;
          urllib.request.urlopen('http://127.0.0.1:' + sys.argv[1] + '/metrics', timeout=3)"
          "$${PERFIN_METRICS_PORT:-9100}"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 40s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Only with the `av` profile (PERFIN_ANTIVIRUS=clamav); ignored otherwise.
      clamav:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # ------------------------------------------------------------------- db --
  db:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:16-alpine}
    # The image's own postgres user (UID 70); the entrypoint then never
    # needs root or any capability.
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    memswap_limit: 1g
    shm_size: 128m
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /var/run/postgresql:size=1m,mode=2777,uid=70,gid=70,noexec,nosuid,nodev
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - listen_addresses=*
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: perfin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      # Read by db-init/10-perfin-roles.sh on first start only.
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      PERFIN_DB_OWNER_ROLE: perfin_owner
      PERFIN_DB_APP_ROLE: ${PERFIN_DB_APP_ROLE:-perfin_app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "perfin", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging

  # --------------------------------------------------------------- clamav --
  # Optional antivirus for quarantined files (profile `av`, PERFIN_ANTIVIRUS=
  # clamav, SECURITY.md C9). The worker streams each document's plaintext to
  # clamd INSTREAM on tcp://clamav:3310 over the internal `backend` network
  # (PERFIN_CLAMAV_ADDRESS); nothing publishes the port. Keep clamd's
  # StreamMaxLength at least PERFIN_CLAMAV_MAX_MB. Signature updates (freshclam) reach the internet only through
  # the egress proxy: add database.clamav.net to egress-allowlist.txt and set
  # FRESHCLAM_CONF_HTTPProxyServer=egress and FRESHCLAM_CONF_HTTPProxyPort=3128
  # in this service's environment (CLAMD_CONF_StreamMaxLength likewise).
  clamav:
    image: ${CLAMAV_IMAGE:-docker.io/clamav/clamav:stable}
    profiles: [av]
    read_only: true
    cap_drop: [ALL]
    # The image starts as root, fixes ownership of its state directory and
    # drops to the clamav user; these are the capabilities that needs.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 3g
    memswap_limit: 3g
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
      - /run/clamav:size=8m,mode=0777
      - /var/log/clamav:size=16m,mode=0777
    # The image's /init cannot run with a read-only root filesystem (it
    # re-links /var/lock and edits /etc/clamav in place); clamav/entrypoint.sh
    # does the same work in /tmp. Proxy settings for freshclam go in as
    # FRESHCLAM_CONF_HTTPProxyServer / FRESHCLAM_CONF_HTTPProxyPort.
    entrypoint: ["/sbin/tini", "--", "/bin/sh", "/perfin/clamav-entrypoint.sh"]
    volumes:
      - clamav_db:/var/lib/clamav
      - ./clamav/entrypoint.sh:/perfin/clamav-entrypoint.sh:ro
    networks: [backend, egress]
    healthcheck:
      # The image's own probe (clamdscan PING); the first signature download
      # can take minutes.
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    restart: unless-stopped
    logging: *logging

  # ------------------------------------------------------------------ mcp --
  # Optional read-only MCP server for AI assistants (profile `mcp`,
  # AI_ACCESS.md, `perfin mcp`). It holds one scoped `ai:read` API token and
  # talks only to the API over the `ai` network: it does not read .env
  # (no env_file), so it never sees the database URL, the master key or the
  # secret key, and `perfin mcp` refuses to start if it is given one (M7). No
  # volumes, read-only root, every capability dropped (x-hardened). The
  # streamable-HTTP transport listens on 8001 for the proxy only (`mcp_edge`,
  # see Caddyfile.example); every request needs the MCP_HTTP_TOKEN bearer and an
  # Origin, when sent, from PERFIN_MCP_HTTP_ALLOWED_ORIGINS. PERFIN_MCP_ENABLED
  # is the operator's switch: unless it is true the container exits at once.
  # For stdio instead: `docker compose run --rm -T -e PERFIN_MCP_TRANSPORT=stdio mcp`.
  mcp:
    <<: [*hardened, *perfin-image]
    command: ["mcp"]
    profiles: [mcp]
    environment:
      PERFIN_ROLE: mcp
      PERFIN_MCP_ENABLED: ${PERFIN_MCP_ENABLED:-false}
      PERFIN_MCP_API_URL: http://api:8000
      PERFIN_MCP_TOKEN: ${MCP_API_TOKEN:-}
      PERFIN_MCP_TRANSPORT: http
      PERFIN_MCP_HTTP_HOST: 0.0.0.0
      PERFIN_MCP_HTTP_PORT: "8001"
      PERFIN_MCP_HTTP_ALLOWED_ORIGINS: ${PERFIN_MCP_HTTP_ALLOWED_ORIGINS:-}
      PERFIN_MCP_HTTP_TOKEN: ${MCP_HTTP_TOKEN:-}
      PERFIN_MCP_RATE_PER_MINUTE: ${MCP_RATE_PER_MINUTE:-30}
      PERFIN_LOG_LEVEL: ${PERFIN_LOG_LEVEL:-INFO}
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    healthcheck:
      disable: true
    networks: [ai, mcp_edge]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------- egress --
  # Optional CONNECT-only allowlist proxy (profile `egress`, deploy/egress).
  # The only container with a route to the internet besides the TLS proxy;
  # it reaches only the hosts in egress-allowlist.txt, and never private
  # addresses unless EGRESS_ALLOW_PRIVATE_CIDRS says so.
  egress:
    <<: *hardened
    image: ${EGRESS_IMAGE:-ghcr.io/bchap9/perfin-egress}:${PERFIN_VERSION:-latest}
    build:
      context: ./egress
      args:
        - PYTHON_IMAGE
    profiles: [egress]
    environment:
      EGRESS_ALLOW_PRIVATE_CIDRS: ${EGRESS_ALLOW_PRIVATE_CIDRS:-}
    volumes:
      - ./egress-allowlist.txt:/etc/egress/allowlist.txt:ro
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    networks: [egress, outbound]
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.79.0/24}
          gateway: ${EDGE_GATEWAY:-172.30.79.1}
  web:
    internal: true
    ipam:
      config:
        - subnet: ${WEB_SUBNET:-172.30.80.0/24}
  backend:
    internal: true
  ai:
    internal: true
  mcp_edge:
    internal: true
  egress:
    internal: true
  outbound: {}

volumes:
  pgdata: {}
  documents: {}
  quarantine: {}
  caddy_data: {}
  caddy_config: {}
  clamav_db: {}
