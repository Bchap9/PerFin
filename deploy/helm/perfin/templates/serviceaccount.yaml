{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "perfin.serviceAccountName" . }}
  labels:
    {{- include "perfin.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# PerFin never talks to the Kubernetes API; no token is mounted.
automountServiceAccountToken: false
{{- end }}
