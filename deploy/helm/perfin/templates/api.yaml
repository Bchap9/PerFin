apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "perfin.fullname" . }}-api
  labels:
    {{- include "perfin.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "perfin.componentSelector" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "perfin.componentSelector" (dict "ctx" . "component" "api") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "perfin.serviceAccountName" . }}
      {{- include "perfin.podSecurity" . | nindent 6 }}
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: {{ include "perfin.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "perfin.fullname" . }}-config
          env:
            - name: PERFIN_ROLE
              value: api
            {{- include "perfin.secretEnv" (dict "ctx" . "key" "PERFIN_DATABASE_URL" "optional" false) | nindent 12 }}
            {{- include "perfin.secretEnv" (dict "ctx" . "key" "PERFIN_MASTER_KEY" "optional" false) | nindent 12 }}
            {{- include "perfin.secretEnv" (dict "ctx" . "key" "PERFIN_SECRET_KEY" "optional" false) | nindent 12 }}
            {{- include "perfin.secretEnv" (dict "ctx" . "key" "PERFIN_OIDC_CLIENT_SECRET" "optional" true) | nindent 12 }}
            {{- include "perfin.secretEnv" (dict "ctx" . "key" "PERFIN_SMTP_PASSWORD" "optional" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            # 503 until the database is reachable and at the migration head.
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "perfin.dataMounts" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpSizeLimit }}
        {{- include "perfin.dataVolumes" . | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "perfin.fullname" . }}-api
  labels:
    {{- include "perfin.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "perfin.componentSelector" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
