# SPDX-License-Identifier: AGPL-3.0-or-later
# Words that say what was bought, for a payee the merchant list does not
# know. Read in this order: the first word found in a descriptor's core
# answers, so the more telling word stands higher ("animal hospital" above
# "hospital", "parking" above everything). A keyword is a suggestion unless
# it is `strong`.
#
# A keyword is a trade, never a name: no surname ("Baker", "Cook"), no
# place ("Park", "Springs", "Temple") and no word that fits any business
# ("market", "shop", "club", "bar", "gas", "auto", "home"). A word that
# opens a listed merchant's name ("pizza" in Pizza Hut) may be a keyword
# only in that merchant's group of categories.
#
# The entry description of a labelled ACH line (`DES:RENT`, `CO ENTRY
# DESCR:TUITION`) is read too when the company's name holds no keyword.
#
# `via` ties an entry to a payment processor (the name clean-up gives it).
# With no `word`, the entry covers everything that processor fronts.
keywords:
  # Toast is a point-of-sale system sold to places that serve food and
  # drink. Nearly all are restaurants, so that is stated; where the name
  # itself says coffee, bread or beer, that word answers instead, as a
  # suggestion (the matcher's rule for a `strong` entry).
  - via: toast
    category: food.restaurants
    strong: true
  # What these front is nearly always what they are for; said as a
  # suggestion, because a convenience store delivers through them too.
  - {via: doordash, category: food.delivery}
  - {via: grubhub, category: food.delivery}
  - {via: instacart, category: food.groceries}

  # Where the car was left or washed: said first, so that "hospital parking"
  # is parking and "pet wash" is not a car wash.
  - {word: parking, category: transport.parking}
  - {word: toll, category: transport.parking}
  - {word: car wash, category: transport.car_maintenance}
  - {word: car rental, category: leisure.travel}

  # Animals, before the words they share with people's medicine.
  - {word: animal hospital, category: family.pets}
  - {word: veterinary, category: family.pets}
  - {word: vet, category: family.pets}
  - {word: pet, category: family.pets}
  - {word: pets, category: family.pets}

  # Eating out.
