# SPDX-License-Identifier: AGPL-3.0-or-later
# Places to eat and drink: fast food, coffee and snacks, table service, and
# meals brought to the door. Format and sources: ../README.md. One entry a
# line here: the lists are long.
#
# Clean-up drops a possessive, so "WENDY'S" arrives as `wendy` and
# "CHILI'S" as `chili`: the first is written, the second is not, because a
# chain whose bare name is an everyday word ("Chili's", "Friendly's",
# "Checkers", "Noodles") is matched only by a form that is the chain's own.
# A stem that is also a first name or a surname (`wendy`, `mcdonald`,
# `denny`) is written with ` =`: it is the chain only when it is the whole
# core, never the start of "Wendy's Flowers" or "McDonald Family Dental".
# DoorDash and Grubhub are processors in clean-up and have no entry.
merchants:
