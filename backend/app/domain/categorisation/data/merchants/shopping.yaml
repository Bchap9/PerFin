# SPDX-License-Identifier: AGPL-3.0-or-later
# Shops: general stores and marketplaces, clothing and shoes, electronics,
# beauty, books, crafts, sport and office. Format and sources: ../README.md.
# One entry a line here: the lists are long.
#
# A store that sells everything is `mixed`: what it gives is a suggestion,
# never a fact. A marketplace's membership and digital services are their
# own entries with longer matches, so they win over the marketplace. A name
# that is an everyday word alone ("Gap", "Ross", "Express", "Coach", "Loft",
# "Vans", "Wish", "Academy") is matched only by a form that is the shop's
# own, or left out.
