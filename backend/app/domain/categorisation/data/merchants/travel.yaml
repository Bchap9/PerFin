# SPDX-License-Identifier: AGPL-3.0-or-later
# Airlines, places to stay, booking sites, car hire, long-distance rail and
# coach, cruises. Format and sources: ../README.md. One entry a line here:
# the lists are long.
#
# Many of these names are everyday words or places ("United", "Delta",
# "American", "Frontier", "Spirit", "Budget", "Enterprise", "National",
# "Dollar", "Alamo", "Carnival", "Princess"): each is matched only together
# with the word that makes it the carrier or the hire firm, and by the
# shortened form a ticket prints ("AIRL", never "AIR" alone for those:
# "... AIR CONDITIONING" is somebody else).
merchants:
