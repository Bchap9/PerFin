# SPDX-License-Identifier: AGPL-3.0-or-later
# Grocers, grocery delivery and shops that sell drink to take home. Format
# and sources: ../README.md. One entry a line here: the lists are long.
#
# Clean-up drops a possessive, so "TRADER JOE'S" arrives as `trader joe`:
# both forms are written. A grocer's fuel is in fuel_transport.yaml and its
# pharmacy in health.yaml (longer matches, so they win). Hypermarkets that
# sell everything (Meijer, Fred Meyer, the warehouse clubs) are in
# shopping.yaml as `mixed`. A name that is an everyday word alone ("Giant",
# "Lucky", "Tops") is matched only together with its second word.
merchants:
  # National and large regional supermarkets.
  - {key: kroger, name: Kroger, category: food.groceries, match: [kroger]}
