# The home: hardware and building supplies, furniture and furnishings, and
# the firms that come to fix, clean or spray. Format and sources:
# ../README.md. One entry a line here: the lists are long.
#
# Clean-up drops a possessive, so "LOWE'S" arrives as `lowe`. Alarm,
# storage and utility companies are bills and are not here.
merchants:
  # Hardware, building supplies and farm stores.
  - {key: the home depot, name: The Home Depot, category: housing.improvement, match: [home depot, the home depot, homedepot]}
  - {key: lowes, name: Lowe's, category: housing.improvement, match: [lowes, lowe]}
  - {key: menards, name: Menards, category: housing.improvement, match: [menards]}
