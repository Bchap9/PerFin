# SPDX-License-Identifier: AGPL-3.0-or-later
# Insurers: car, home, life, health, dental and vision, pets, and home
# warranties. Format and sources: ../README.md. One entry a line here.
#
# A premium is `series: bill`: monthly, or paid for six months or a year.
# An insurer that sells several lines under one billing name ("State
# Farm", "Allstate") is `mixed: true`: the statement does not say which
# policy was paid, so its category (car insurance, the usual one) is a
# suggestion and never a fact. A company that is also a bank or a
# retirement plan ("USAA", "Nationwide", "Prudential") is matched only with
# the word that makes the charge a premium.
merchants:
  # Car insurance.
  - {key: geico, name: GEICO, category: transport.car_insurance, series: bill, cadences: [monthly, half_yearly], match: [geico]}
  - {key: progressive, name: Progressive, category: transport.car_insurance, series: bill, cadences: [monthly, half_yearly], match: [progressive insurance, progressive ins, prog direct ins, progressive direct, prog casualty, progressive casualty, progressive leasing ins]}
  - {key: the general, name: The General, category: transport.car_insurance, series: bill, cadences: [monthly], match: [the general insurance, the general ins, general automobile ins]}
