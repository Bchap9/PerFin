  - {key: direct auto insurance, name: Direct Auto Insurance, category: transport.car_insurance, series: bill, cadences: [monthly], match: [direct auto insurance, direct auto ins, direct general]}
  - {key: mercury insurance, name: Mercury Insurance, category: transport.car_insurance, series: bill, cadences: [monthly, half_yearly], match: [mercury insurance, mercury ins, mercury casualty]}

  # Several lines under one name: a suggestion only.
