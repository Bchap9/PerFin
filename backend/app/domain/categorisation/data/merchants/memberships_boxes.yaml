# SPDX-License-Identifier: AGPL-3.0-or-later
# Memberships, and boxes that arrive on a schedule: meal kits, pet food,
# beauty, clothing, razors, wine. Format and sources: ../README.md. One
# entry a line here.
#
# A shop's membership is its own entry with a longer match than the shop,
# so it wins over it ("uber one" over "uber"). A name that is a first name
# or an everyday word ("Harry's", "Billie", "Ollie", "Ritual", "Prose",
# "Clear", "Factor") is matched only by a form that is the company's own,
# or left out.
merchants:
  # Shop and delivery memberships.
  - {key: sams club membership, name: Sam's Club Membership, category: leisure.memberships, series: subscription, cadences: [annual], match: [sams club membership, sam club membership, samsclub membership, sams club renewal, sam club renewal, sams membership]}
