# SPDX-License-Identifier: AGPL-3.0-or-later
# Video streaming services. Format and sources: ../README.md.
#
# A service whose name is an everyday word ("Max", "Peacock", "Paramount",
# "Philo", "Sling") is matched only by a form that cannot be a shop, a
# cinema or a place: a wrong fact is worse than no answer.
merchants:
  - key: netflix
    name: Netflix
    category: leisure.subscriptions
    series: subscription
    cadences: [monthly]
    match: [netflix]

  - key: hulu
    name: Hulu
    category: leisure.subscriptions
    series: subscription
    cadences: [monthly, annual]
    match: [hulu, hlu hulu]

  - key: disney plus
    name: Disney+
    category: leisure.subscriptions
    series: subscription
    cadences: [monthly, annual]
    match: [disney plus, disneyplus]

  - key: hbo max
    name: Max (HBO)
    category: leisure.subscriptions
    series: subscription
    cadences: [monthly, annual]
    match: [hbo, hbo max, hbomax, help max com]

  - key: paramount plus
    name: Paramount+
    category: leisure.subscriptions
    series: subscription
    cadences: [monthly, annual]
