# SPDX-License-Identifier: AGPL-3.0-or-later
# Fuel and charging, rides, public transit, parking and tolls, and what a
# car needs. Format and sources: ../README.md. One entry a line here: the
# lists are long.
#
# A convenience chain with pumps (Wawa, Sheetz, QuikTrip...) sells fuel and
# food under one name, so it is `mixed`: its category is only ever a
# suggestion. A warehouse club's or a grocer's fuel is its own entry with a
# longer match than the store's. A brand whose name is an everyday word or a
# place ("Shell", "Pilot", "Marathon", "Gulf", "Sinclair", "Firestone",
# "Napa", "Bart") is matched only together with its second word.
merchants:
