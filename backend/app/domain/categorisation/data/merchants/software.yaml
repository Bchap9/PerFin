# SPDX-License-Identifier: AGPL-3.0-or-later
# Software, apps, storage and online services paid by the month or the
# year. Format and sources: ../README.md. One entry a line here.
#
# An opaque biller (an app store, a platform's billing name) fronts many
# products and the statement does not say which: it is one merchant,
# `mixed: true`, so its category is only ever a suggestion, and a series of
# it is still found by its amount. A product the statement does name
# ("GOOGLE *Google One") is its own entry with a longer match, so it wins.
#
# A name that is also a surname or an everyday word ("Norton", "Notion",
# "Zoom", "Box", "Slack", "Calm") is matched only by a form that is the
# service's own, or left out.
merchants:
  # Opaque billers.
  - {key: apple services, name: Apple (App Store and services), category: leisure.software, series: subscription, cadences: [monthly, annual], mixed: true, match: [apple com bill, apl itunes com bill, apl itunes, itunes com bill, itunes com, apple services]}
  - {key: google play, name: Google Play, category: leisure.software, series: subscription, cadences: [monthly, annual], mixed: true, match: [google play, google]}
  - {key: microsoft, name: Microsoft, category: leisure.software, series: subscription, cadences: [monthly, annual], mixed: true, match: [microsoft, msft, msbill info]}

  # What those billers name on the statement.
  - {key: google one, name: Google One, category: leisure.software, series: subscription, cadences: [monthly, annual], match: [google one ~, googleone ~, google storage ~]}
  - {key: google workspace, name: Google Workspace, category: leisure.software, series: subscription, cadences: [monthly, annual], match: [google workspace, google gsuite, google g suite]}
  - {key: google cloud, name: Google Cloud, category: leisure.software, series: subscription, cadences: [monthly], match: [google cloud]}
  - {key: google store, name: Google Store, category: shopping.electronics, match: [google store, google google store]}
  - {key: microsoft 365, name: Microsoft 365, category: leisure.software, series: subscription, cadences: [monthly, annual], match: [microsoft 365, microsoft office, msft office, microsoft365]}
  - {key: apple icloud, name: iCloud, category: leisure.software, series: subscription, cadences: [monthly], match: [apple icloud, icloud]}

  # Creative and office tools.
  - {key: adobe, name: Adobe, category: leisure.software, series: subscription, cadences: [monthly, annual], match: [adobe]}
  - {key: canva, name: Canva, category: leisure.software, series: subscription, cadences: [monthly, annual], match: [canva]}
  - {key: figma, name: Figma, category: leisure.software, series: subscription, cadences: [monthly, annual], match: [figma]}
  - {key: grammarly, name: Grammarly, category: leisure.software, series: subscription, cadences: [monthly, quarterly, annual], match: [grammarly]}
  - {key: evernote, name: Evernote, category: leisure.software, series: subscription, cadences: [monthly, annual], match: [evernote]}
  - {key: notion, name: Notion, category: leisure.software, series: subscription, cadences: [monthly, annual], match: [notion labs, notion so]}
  - {key: zoom, name: Zoom, category: leisure.software, series: subscription, cadences: [monthly, annual], match: [zoom us, zoomus, zoom video]}
  - {key: docusign, name: Docusign, category: leisure.software, series: subscription, cadences: [monthly, annual], match: [docusign]}
  - {key: github, name: GitHub, category: leisure.software, series: subscription, cadences: [monthly, annual], match: [github]}

  # Assistants.
  - {key: openai, name: OpenAI (ChatGPT), category: leisure.software, series: subscription, cadences: [monthly], match: [openai, chatgpt]}
  - {key: anthropic, name: Anthropic (Claude), category: leisure.software, series: subscription, cadences: [monthly, annual], match: [anthropic, claude ai]}
  - {key: midjourney, name: Midjourney, category: leisure.software, series: subscription, cadences: [monthly, annual], match: [midjourney]}

