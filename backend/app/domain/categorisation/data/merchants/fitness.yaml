# Gyms, studios and the fitness and wellness services paid by the month.
# Format and sources: ../README.md. One entry a line here.
#
# A gym bills dues monthly and an "annual fee" once a year. A name that is
# an everyday word ("Curves", "Crunch", "Calm", "Equinox", "Mirror") is matched
# only by a form that is the club's own, or left out.
merchants:
