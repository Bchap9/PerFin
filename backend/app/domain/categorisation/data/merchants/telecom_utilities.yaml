# SPDX-License-Identifier: AGPL-3.0-or-later
# Bills: mobile phone, internet and television, electricity, gas, water and
# refuse, alarm companies and storage units, by the names they bill under.
# Format and sources: ../README.md. One entry a line here.
#
# A bill comes monthly (water and refuse often every two or three months)
# and its amount moves, so it is `series: bill`, never a subscription.
# A utility that sells both power and gas is filed under electricity. A
# name that is an everyday word or a surname ("Spectrum", "Optimum", "Cox",
# "Frontier", "Visible", "Ring", "Spire", "Dish") is matched only together
# with the word that makes it the company; town and county water offices
# are local and are not here. A company whose one billing name covers a
# mobile phone and a line at home ("Verizon", "AT&T") is `mixed: true` under
# that bare name: the category is a suggestion, the bill is still a bill.
merchants:
  # Mobile phone.
  - {key: verizon wireless, name: Verizon Wireless, category: utilities.phone, series: bill, cadences: [monthly], match: [verizon wireless, verizon wrls, verizon wrl, vzwrlss, vzw, vz wireless]}
  - {key: at and t wireless, name: AT&T Wireless, category: utilities.phone, series: bill, cadences: [monthly], match: [at t mobility, att mobility, at t wireless, att wireless]}
  # The bare name bills a phone or a line at home alike: a suggestion only.
  - {key: verizon, name: Verizon, category: utilities.phone, series: bill, cadences: [monthly], mixed: true, match: [verizon]}
  - {key: at and t, name: AT&T, category: utilities.phone, series: bill, cadences: [monthly], mixed: true, match: [at t, att]}
  - {key: t mobile, name: T-Mobile, category: utilities.phone, series: bill, cadences: [monthly], match: [t mobile, tmobile, tmo]}
