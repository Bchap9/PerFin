  - {text: "4111-1111-1111-1111", secrets: ["4111111111111111"]}
  - {text: "4111.1111.1111.1111", secrets: ["4111111111111111"]}
  - {text: "4111111111111111", secrets: ["4111111111111111"]}
  - {text: "PAID WITH 5555555555554444 ONLINE", secrets: ["5555555555554444"]}
  - {text: "AMEX 3782 822463 10005", secrets: ["378282246310005"]}
