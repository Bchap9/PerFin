  - {text: "1234_5678_9012", secrets: ["123456789012", "5678", "9012"]}
  - {text: "1234,5678,9012", secrets: ["123456789012", "5678", "9012"]}
  - {text: "acct 1234/5678/9012", secrets: ["123456789012", "5678", "9012"]}
  # Security review P6B-SR-R2-01: (a) every space-separated group of a number
  # after a keyword, (b) a bracketed number, (c) a keyword glued to its digits
  # or joined by a non-ASCII separator, (d) a bare stored last four
  # (config.yaml account_numbers; ``needs_terms``: only the API stage knows
  # the household's numbers, the MCP stage cannot).
  - {text: "Account 9876 5432", secrets: ["9876", "5432"]}
  - {text: "acct 12 3456", secrets: ["3456"]}
  - {text: "Card 4111 1111", secrets: ["4111", "1111"]}
  - {text: "loan 4455 6677", secrets: ["4455", "6677"]}
  - {text: "IBAN DE89 3704", secrets: ["3704"]}
  - {text: "routing 0210 0002 1", secrets: ["0210", "0002"]}
