# SPDX-License-Identifier: AGPL-3.0-or-later
# Account, card, routing, IBAN and loan numbers -> [ACCT]. Every number is
# invented (card numbers are the public test numbers of the card schemes).
# ``secrets``: digit strings that must not survive in any form. Every case is
# also checked under the obfuscations of test_scrubber_corpus.VARIANTS.
placeholder: "[ACCT]"
kind: digits
cases:
  - {text: "ACCT ...5678", secrets: ["5678"]}
  - {text: "ACCT...5678 TRANSFER", secrets: ["5678"]}
  - {text: "VISA...5678", secrets: ["5678"]}
  - {text: "Payment from card …4821", secrets: ["4821"]}
  - {text: "XXXX1234 PURCHASE", secrets: ["1234"]}
  - {text: "xxxx-1234 debit", secrets: ["1234"]}
  - {text: "****1234", secrets: ["1234"]}
  - {text: "CARD ****9911 AUTH", secrets: ["9911"]}
  - {text: "•••• 7310 contactless", secrets: ["7310"]}
  - {text: "CHK XX**4402", secrets: ["4402"]}
  - {text: "CARD x6543 SQ *CAFE", secrets: ["6543"]}
  - {text: "ACCT 1234", secrets: ["1234"]}
  - {text: "acct# 99887", secrets: ["99887"]}
  - {text: "Account no. 4455", secrets: ["4455"]}
