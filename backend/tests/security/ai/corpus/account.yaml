  # Security review P6B-SR-R1-02: single-star and "x " masks, card brands and
  # networks without a "card" keyword, words between keyword and number, and
  # 12-digit numbers split by "/", "_" or ",".
  - {text: "VISA *3344", secrets: ["3344"]}
  - {text: "*7788", secrets: ["7788"]}
  - {text: "AMAZON MKTPLACE VISA * 4321", secrets: ["4321"]}
