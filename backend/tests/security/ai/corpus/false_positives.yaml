  - "AMAZON MKTPLACE PMTS AMZN.COM/BILL WA"
  - "STARBUCKS #1234 SEATTLE WA"
  - "TRADER JOE'S #552 PORTLAND OR"
  - "COSTCO WHSE #0123"
  - "TJ MAXX 1234"
  - "UBER *TRIP"
  - "SQ *BLUE BOTTLE COFFEE"
  - "PAYPAL *NETFLIX"
  - "NETFLIX.COM"
  - "SPOTIFY USA"
