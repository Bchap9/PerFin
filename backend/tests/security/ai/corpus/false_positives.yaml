# Ordinary merchant strings that must survive the scrubber unchanged.
#
# Store-number policy (app/core/scrubber.py): numbers of up to six digits
# after a merchant name ("#1234", "0123") are kept; merchant city and state
# are financial facts and kept; dates and amounts are kept. Seven or more
# digits in a row are redacted as possible account numbers, so long terminal
# or order numbers are not in this list on purpose.
cases:
