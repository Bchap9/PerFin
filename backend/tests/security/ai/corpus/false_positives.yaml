  # after "@", an "@" in ordinary text, an amount or a date after a keyworded
  # number's neighbour, words that only resemble a member's name.
  - "Coffee @ Starbucks.com"
  - "Lunch @ Cafe. Then home"
  - "Card payment 12.50 2026-03-04"
  - "What does it cost"
  - "Starbucks Card Reload 25.00"
