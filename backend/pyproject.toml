# SPDX-License-Identifier: AGPL-3.0-or-later
[project]
name = "perfin"
version = "1.0.0-rc.5"
description = "Self-hosted, security-first personal finance application"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]>=3.3.6",
    "argon2-cffi",
    "pynacl",
    "pyotp",
    "webauthn",
    "pyjwt[crypto]",
    "httpx",
    "defusedxml",
    "python-multipart",
    "prometheus-client",
    "pyyaml",
    "pymupdf",
    "openpyxl",
    "pillow",
    "pillow-heif",
    "mcp",
    "reportlab",
    "pyseccomp",
    "tesserocr>=2.12.0",
]

[project.scripts]
perfin = "app.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "respx",
    "mypy",
    "ruff",
    "bandit[toml]",
    "pip-audit",
    "types-pyyaml",
    "types-defusedxml",
    "pytest-xdist",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
python-preference = "system"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "BLE", "C4", "SIM", "RUF", "PT", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the point; fixed test credentials and subprocess use are expected.
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "S603", "S607"]
"migrations/**" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "migrations"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["tesserocr.*", "pyseccomp.*", "fitz.*", "pymupdf.*", "pillow_heif.*", "reportlab.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs a real PostgreSQL (PERFIN_TEST_DATABASE_URL)",
    "security: security regression tests (authz matrix, CSRF, fuzz corpus, scrubber)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
