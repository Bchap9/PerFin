#   pipx install pre-commit   # or: uv tool install pre-commit
#   pre-commit install
# CI runs the same scan over the full history (.github/workflows/security.yml).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
