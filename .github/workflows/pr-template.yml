#
# Every pull request description must follow .github/pull_request_template.md
# (scripts/check_pr_body.py). Runs again when the description is edited.
# Dependabot PRs are exempt: their body is generated.
#
# Third-party actions are pinned to full commit SHAs (the tag each SHA was
# resolved from is in the trailing comment); Dependabot keeps them current.
name: pr-template

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: PR description follows the template
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check PR description
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -I scripts/check_pr_body.py
